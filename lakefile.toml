  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexModArithTheory"
git = "https://github.com/leanprover/hex-mod-arith-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexPolyFpTheory"
git = "https://github.com/leanprover/hex-poly-fp-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexConway"
git = "https://github.com/leanprover/hex-conway.git"
rev = "v0.10.0"

[[require]]
name = "HexGF2Theory"
git = "https://github.com/leanprover/hex-gf2-theory.git"
rev = "v0.10.0"

[[require]]
name = "HexGFq"
git = "https://github.com/leanprover/hex-gfq.git"
rev = "v0.10.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexGFqTheory"
